<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidebar with Display Toggle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <style>
    .sidebar-gradient:hover {
      background: linear-gradient(to right, rgba(0, 128, 0, 0.4), rgba(0, 0, 0, 0));
    }
  </style>
</head>
<body class="bg-gradient-to-tr from-gray-800 to-gray-900 text-white font-sans">

  <!-- Sidebar -->
  <div class="sidebar-gradient group fixed top-0 left-0 h-screen w-[60px] hover:w-[150px] overflow-hidden transition-all duration-300  flex justify-center items-center flex-col">

    <!-- Home -->
    <div class="flex items-center space-x-4 p-4 hover:text-white text-gray-400 cursor-pointer transition-colors duration-300">
      <i class="fas fa-home w-5 text-green-400"></i>
      <span class="hidden group-hover:block whitespace-nowrap transition duration-300">
        Home
      </span>
    </div>

    <!-- Search -->
    <div class="flex items-center space-x-4 p-4 hover:text-white text-gray-400 cursor-pointer transition-colors duration-300">
      <i class="fas fa-search w-5 text-green-400"></i>
      <span class="hidden group-hover:block whitespace-nowrap transition duration-300">
        Search
      </span>
    </div>

  </div>

  <!-- Main Content -->
  <div class="ml-[60px] p-10 min-h-screen bg-gradient-to-tr from-gray-800 to-gray-900">
    <h1 class="text-3xl font-bold text-green-400 mb-4">Sidebar Demo 🌿</h1>
    <p>This sidebar uses <code>display: none</code> and <code>display: block</code> for text reveal.</p>
  </div>

</body>
</html>
